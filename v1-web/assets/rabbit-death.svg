      <circle class="eye" cx="-6" cy="1" r="2.3"/>
      <circle class="eye" cx="7" cy="1" r="2.3"/>
      <path class="outline" d="M-12 27 C-19 37 -11 42 -4 31" fill="none"/>
      <path class="outline" d="M11 27 C20 36 13 42 5 31" fill="none"/>
      <path class="outline" d="M-16 12 C-27 14 -28 24 -18 24" fill="none"/>
      <path class="outline" d="M16 12 C28 14 29 24 19 24" fill="none"/>
    </g>
