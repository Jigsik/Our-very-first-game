<svg xmlns="http://www.w3.org/2000/svg" width="576" height="144" viewBox="0 0 576 144">
  <defs>
    <style>
      .outline { stroke: #231f20; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .body { fill: #f4efe2; }
      .belly { fill: #d9d1bf; }
      .ear { fill: #f7f0e2; }
      .inner { fill: #ddb7b2; }
      .eye { fill: #231f20; }
      .shock { fill: none; stroke: #fff4a3; stroke-width: 3; stroke-linecap: round; }
    </style>
    <g id="rabbit-upright">
